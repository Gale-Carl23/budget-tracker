name: PostgreSQL backup and restore check

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-and-restore-check:
    runs-on: ubuntu-latest
    container:
      image: postgres:${{ vars.POSTGRES_MAJOR || '18' }}
      options: --user root
    services:
      restore-db:
        image: postgres:${{ vars.POSTGRES_MAJOR || '18' }}
        env:
          POSTGRES_DB: nibi_restore_check
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: restore-check-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nibi_restore_check"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: restore-check-only
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
      BACKUP_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
    steps:
      - name: Install AWS CLI
        run: apt-get update && apt-get install -y --no-install-recommends awscli ca-certificates && rm -rf /var/lib/apt/lists/*
      - name: Validate required configuration
        run: |
          test -n "$DATABASE_URL"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$AWS_DEFAULT_REGION"
          test -n "$BACKUP_BUCKET"
      - name: Dump PostgreSQL database
        run: pg_dump --format=custom --no-owner --no-acl "$DATABASE_URL" --file=/tmp/nibi.dump
      - name: Upload encrypted backup to private S3 bucket
        run: |
          backup_name="nibi-$(date -u +%Y%m%dT%H%M%SZ).dump"
          aws s3 cp /tmp/nibi.dump "s3://${BACKUP_BUCKET}/nibi/${backup_name}" --sse AES256 --only-show-errors
      - name: Restore dump into a temporary PostgreSQL service
        run: pg_restore --exit-on-error --no-owner --no-acl --host=restore-db --username=postgres --dbname=nibi_restore_check /tmp/nibi.dump
      - name: Confirm restored application tables
        run: |
          psql --host=restore-db --username=postgres --dbname=nibi_restore_check --set=ON_ERROR_STOP=1 \
            --command="SELECT COUNT(*) AS restored_users FROM auth_user; SELECT COUNT(*) AS restored_transactions FROM finance_transaction;"
