{% extends "base.html" %}{% block title %}Reset password{% endblock %}{% block public %}<div class="auth-wrap"><a class="brand" href="{% url 'landing' %}"><span class="brandmark">✳</span><span>Nibi</span></a><section class="auth-card"><span class="eyebrow">ACCOUNT RECOVERY</span><h1>Reset your password</h1><p class="muted">Enter the email address on your account. If it matches, we’ll send a reset link.</p><form method="post">{% csrf_token %}<label>Email{{ form.email }}{% for error in form.email.errors %}<span class="field-error">{{ error }}</span>{% endfor %}</label><button class="btn full">Send reset link</button></form><p class="auth-foot"><a href="{% url 'login' %}">Back to sign in</a></p></section></div>{% endblock %}
